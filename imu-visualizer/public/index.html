<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IMU Visualizer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>IMU Data</h1>

    <div class="graphs">

        <div class="graph">
            <h2>Accelerometer X</h2>
            <canvas id="accelX"></canvas>
        </div>

        <div class="graph">
            <h2>Gyroscope X</h2>
            <canvas id="gyroX"></canvas>
        </div>

        <div class="graph">
            <h2>Accelerometer Y</h2>
            <canvas id="accelY"></canvas>
        </div>

        <div class="graph">
            <h2>Gyroscope Y</h2>
            <canvas id="gyroY"></canvas>
        </div>

        <div class="graph">
            <h2>Accelerometer Z</h2>
            <canvas id="accelZ"></canvas>
        </div>

        <div class="graph">
            <h2>Gyroscope Z</h2>
            <canvas id="gyroZ"></canvas>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
